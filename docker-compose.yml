services:
  postgres:
    image: postgres:16-alpine
    container_name: sanjeevani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanjeevani}
      POSTGRES_DB: ${POSTGRES_DB:-sanjeevani}
    ports:
      - "5432:5432"
    volumes:
      - sanjeevani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanjeevani} -d ${POSTGRES_DB:-sanjeevani}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sanjeevani_pgdata:
