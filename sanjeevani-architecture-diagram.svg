<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Styling -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f3f5;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#bgGradient)" />

  <!-- Client Section -->
  <rect x="50" y="100" width="150" height="100" rx="6" ry="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5" filter="url(#dropShadow)" />
  <text x="125" y="140" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">React</text>
  <text x="125" y="165" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">Frontend</text>

  <!-- Backend Section -->
  <rect x="50" y="250" width="150" height="100" rx="6" ry="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5" filter="url(#dropShadow)" />
  <text x="125" y="290" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">FastAPI</text>
  <text x="125" y="315" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">Backend</text>

  <!-- AI Orchestration Section -->
  <rect x="250" y="175" width="250" height="150" rx="6" ry="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5" filter="url(#dropShadow)" />
  <text x="375" y="205" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">LangChain</text>
  <text x="375" y="225" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">Orchestration</text>
  
  <!-- AI Models -->
  <rect x="270" y="245" width="100" height="60" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
  <text x="320" y="275" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">Gemini</text>
  <text x="320" y="295" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Image Analysis</text>
  
  <rect x="380" y="245" width="100" height="60" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
  <text x="430" y="275" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">Llama 70B</text>
  <text x="430" y="295" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Reasoning</text>

  <!-- Database Section -->
  <rect x="550" y="100" width="200" height="150" rx="6" ry="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5" filter="url(#dropShadow)" />
  <text x="650" y="130" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">Knowledge Base</text>
  
  <rect x="570" y="150" width="160" height="40" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
  <text x="650" y="175" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">ChromaDB</text>
  
  <rect x="570" y="195" width="160" height="40" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
  <text x="650" y="220" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold">Nomic</text>

  <!-- RAG Section -->
  <rect x="550" y="300" width="200" height="100" rx="6" ry="6" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5" filter="url(#dropShadow)" />
  <text x="650" y="340" font-family="Arial, sans-serif" font-size="16" fill="#212529" text-anchor="middle" font-weight="bold">LangChain</text>
  <text x="650" y="365" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">RAG System</text>

  <!-- Connection Arrows -->
  <!-- Frontend to Backend -->
  <path d="M 125 200 L 125 250" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="125,250 122,240 128,240" fill="#adb5bd" />
  
  <!-- Backend to LangChain -->
  <path d="M 200 300 L 250 250" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="250,250 241,255 245,260" fill="#adb5bd" />
  
  <!-- LangChain to RAG -->
  <path d="M 500 250 L 550 320" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="550,320 540,318 543,312" fill="#adb5bd" />
  
  <!-- RAG to Knowledge Base -->
  <path d="M 650 300 L 650 250" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="650,250 647,260 653,260" fill="#adb5bd" />
  
  <!-- LangChain to Knowledge Base -->
  <path d="M 500 200 L 550 175" stroke="#adb5bd" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="550,175 540,178 543,184" fill="#adb5bd" />
</svg>
